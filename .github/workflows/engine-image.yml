name: Engine image

# Publishes the engine image of the container backend
# (docker/engine/Dockerfile, docs/security.md §4) to GHCR for every release,
# so that `texrun compile --backend container` works without cloning the
# repository (#48):
#
#   ghcr.io/nishide-dev/texrun-engine:<version>   (linux/amd64, linux/arm64)
#
# <version> is the texrun version (Cargo.toml `workspace.package.version`,
# without the `v` of the tag); it is the default image of that texrun
# (texrun_sandbox::DEFAULT_IMAGE) and the image's
# `org.opencontainers.image.version` label, which texrun reports in
# `engine.version`. Each version is pushed once: the tag is never
# overwritten, so a digest users pinned stays the one of that version.
#
# - push of a `v*` tag: verify (the version matches Cargo.toml; the
#   container backend tests pass against the amd64 image), then publish
#   with an SBOM, SLSA provenance (buildx attestations) and a signed GitHub
#   artifact attestation.
# - pull_request (engine image or this workflow changed), and
#   workflow_dispatch with `publish` off (the default): multi-arch dry-run
#   build, nothing is pushed. The amd64 image is also built and tested on
#   every PR by the `sandbox` job of ci.yml.
# - workflow_dispatch with `publish` on, run on a `v*` tag: the same as a
#   tag push (e.g. to retry a failed publish). Refused on any other ref.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - docker/engine/**
      - .github/workflows/engine-image.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to GHCR (only when run on a v* tag); off = dry-run build
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Only cancel superseded PR runs; a publish always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/nishide-dev/texrun-engine
  PLATFORMS: linux/amd64,linux/arm64
  # QEMU for the arm64 build on the amd64 runner. Pinned by digest; not
  # updated by Dependabot, bump it manually.
  BINFMT_IMAGE: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  # Multi-arch build without pushing: the image is written to an OCI
  # archive on the runner, and the archive is checked to contain both
  # platforms with their SBOM / provenance attestations.
  build:
    name: build (dry run)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The amd64 layers come from the cache of ci.yml's `sandbox` job.
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/engine
          file: docker/engine/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/engine-image.tar
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=texrun-engine
      - name: Check platforms and attestations
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/engine-image.tar"
          blob() { tar -xOf "${archive}" "blobs/sha256/${1#sha256:}"; }
          index="$(tar -xOf "${archive}" index.json | jq -r '.manifests[0].digest')"
          manifests="$(blob "${index}" | jq -c '.manifests[]')"
          echo "${manifests}" | jq -r '[.platform.os, .platform.architecture, (.annotations["vnd.docker.reference.type"] // "image")] | join(" ")'
          for arch in amd64 arm64; do
            image="$(echo "${manifests}" | jq -r --arg a "${arch}" 'select(.platform.architecture == $a and .platform.os == "linux") | .digest')"
            [ -n "${image}" ] || { echo "::error::no linux/${arch} image"; exit 1; }
            attestation="$(echo "${manifests}" | jq -r --arg d "${image}" \
              'select(.annotations["vnd.docker.reference.type"] == "attestation-manifest" and .annotations["vnd.docker.reference.digest"] == $d) | .digest')"
            [ -n "${attestation}" ] || { echo "::error::no attestations for linux/${arch}"; exit 1; }
            types="$(blob "${attestation}" | jq -r '.layers[].annotations["in-toto.io/predicate-type"]')"
            echo "linux/${arch}: ${types//$'\n'/, }"
            for type in https://spdx.dev/Document https://slsa.dev/provenance/v1; do
              grep -qxF "${type}" <<< "${types}" || { echo "::error::no ${type} attestation for linux/${arch}"; exit 1; }
            done
          done
          du -h "${archive}"

  # Checks the release and tests the image before anything is pushed. Has
  # no write permissions: the tests build and run the workspace's crates.
  verify:
    name: verify release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TEXRUN_SANDBOX_IMAGE: texrun-engine:release
      TEXRUN_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only a v* tag whose version is the workspace version is published.
      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::images are only published from a v* tag (this run is on ${GITHUB_REF})"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not v<semver>"
            exit 1
          fi
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "${version}" != "${cargo_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${cargo_version} (Cargo.toml)"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The layers are cached for the publish job, so that its amd64 image
      # is the one tested here.
      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/engine
          file: docker/engine/Dockerfile
          tags: ${{ env.TEXRUN_SANDBOX_IMAGE }}
          load: true
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-to: type=gha,scope=texrun-engine-release,mode=max
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      # The same tests as ci.yml's `sandbox` job.
      - name: Run container backend tests
        shell: bash
        env:
          TEXRUN_REQUIRE_TEXLIVE: "1"
          TEXRUN_TEST_BACKEND: container
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/sandbox.log"
          cargo test --locked --all-features -p texrun-sandbox 2>&1 | tee "${log}"
          cargo test --locked --all-features -p texrun-texlive \
            --test container --test scenarios --test security 2>&1 | tee -a "${log}"
          cargo test --locked --all-features -p texrun --test container 2>&1 | tee -a "${log}"
          if grep -E 'test result: .* [1-9][0-9]* ignored' "${log}"; then
            echo "::error::Some tests are #[ignore]d and never run in CI"
            exit 1
          fi
      # texrun of this version reports the image as its own
      # (`engine.version`), and uses it by default once it has that name.
      - name: Check engine.version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker tag "${TEXRUN_SANDBOX_IMAGE}" "${IMAGE}:${VERSION}"
          dir="$(mktemp -d)"
          printf '%s\n' '\documentclass{article}' '\begin{document}' 'x' '\end{document}' > "${dir}/main.tex"
          cargo run --locked -q -p texrun -- compile --json --no-preview --backend container "${dir}/main.tex" > "${dir}/result.json"
          jq -r '.engine.version' "${dir}/result.json"
          jq -e --arg v "image version ${VERSION})" '.texrun_exit_code == 0 and (.engine.version | endswith($v))' "${dir}/result.json" >/dev/null \
            || { cat "${dir}/result.json"; echo "::error::engine.version does not report image version ${VERSION}"; exit 1; }

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Push to GHCR.
      packages: write
      # Signed artifact attestation (Sigstore) of the pushed image.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} already exists; published versions are not overwritten"
            exit 1
          fi
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/engine
          file: docker/engine/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          # SBOM (the Debian packages of the image, from the dpkg database)
          # and SLSA provenance, stored with the image in the registry.
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}#engine-image
            org.opencontainers.image.title=texrun-engine
            org.opencontainers.image.description=TeX Live engine image of the texrun container backend (--backend container)
          annotations: |
            index:org.opencontainers.image.version=${{ env.VERSION }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.description=TeX Live engine image of the texrun container backend (--backend container)
          # The amd64 layers tested by the verify job (built afresh there,
          # not from main's cache, so the release has current packages).
          cache-from: type=gha,scope=texrun-engine-release
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records are only available to organization-owned
          # repositories.
          create-storage-record: false
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          {
            echo "### ${IMAGE}:${VERSION}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo "gh attestation verify oci://${IMAGE}:${VERSION} -R ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
