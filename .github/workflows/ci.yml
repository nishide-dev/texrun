name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Re-run `deny` periodically so newly published RustSec advisories are
  # noticed even when no code changes. Other jobs are skipped on schedule.
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Only cancel superseded PR runs; every main push and scheduled run completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

# Job names are referenced by branch protection. Keep them stable.
jobs:
  fmt:
    name: fmt
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show
      - run: cargo fmt --all -- --check

  check:
    name: check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --all-features --locked

  clippy:
    name: clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The tool version is not updated by Dependabot; bump it manually.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9
      - name: Run tests (nextest)
        run: cargo nextest run --workspace --all-features --locked --no-tests=fail
      # nextest does not run doctests.
      - name: Run doctests
        run: cargo test --workspace --all-features --locked --doc

  # TeX Live integration tests (#10) in the Docker dev image
  # (docker/dev/Dockerfile), so CI and local runs use the same TeX Live and
  # preview tools. TEXRUN_REQUIRE_TEXLIVE / TEXRUN_REQUIRE_PREVIEW_TOOLS turn
  # a missing tool into a test failure instead of a silent skip.
  integration:
    name: integration
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: texrun-dev:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Layers are cached in the GitHub Actions cache, so the image is only
      # rebuilt when the Dockerfile (or its base image digest) changes. The
      # cache is written from main pushes only, like the cargo cache below;
      # PRs read it.
      - name: Build dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/dev
          file: docker/dev/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=texrun-dev
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=texrun-dev,mode=max' || '' }}
      # Build output and the cargo registry of the container. Saved from main
      # only; PRs restore the latest main cache.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/docker
            ${{ runner.temp }}/cargo-registry
          key: integration-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/dev/Dockerfile') }}
          restore-keys: integration-
      - name: Tool versions
        run: |
          docker run --rm "${IMAGE}" sh -c \
            'cargo --version && latexmk -v | head -n 2 && pdflatex --version | head -n 1 && mutool -v 2>&1 | head -n 1 && pdfinfo -v 2>&1 | head -n 1'
      # TeX Live tests are selected at run time (TEXRUN_REQUIRE_TEXLIVE), and
      # this job does not pass `--ignored`: an `#[ignore]`d test would
      # silently never run here. So the job fails if any test binary reports
      # an ignored test, whatever the reason given for it.
      - name: Run tests (TeX Live required, nothing ignored)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/cargo-registry"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace \
            -v "${RUNNER_TEMP}/cargo-registry:/usr/local/cargo/registry" \
            -e CARGO_TARGET_DIR=/workspace/target/docker \
            -e CARGO_TERM_COLOR -e CARGO_INCREMENTAL -e RUST_BACKTRACE \
            -e TEXRUN_REQUIRE_TEXLIVE=1 \
            -e TEXRUN_REQUIRE_PREVIEW_TOOLS=1 \
            "${IMAGE}" \
            cargo test --workspace --all-features --locked 2>&1 | tee "${RUNNER_TEMP}/integration.log"
          if grep -E 'test result: .* [1-9][0-9]* ignored' "${RUNNER_TEMP}/integration.log"; then
            echo "::error::Some tests are #[ignore]d and never run in CI; use require_texlive!() / run-time detection instead (docs/development.md)"
            exit 1
          fi
      # cgroup limits (#25, docs/development.md "cgroup test"): the cgroup
      # mount of the container above is read-only, so the cgroup tests skip
      # there. The whole suite runs again in a privileged container that
      # docker/dev/with-cgroup.sh prepares, so that the tests whose `auto`
      # behaviour changes with a usable cgroup are covered too;
      # TEXRUN_REQUIRE_CGROUP=1 (set by the script) turns a missing cgroup
      # into a failure.
      #
      # --privileged is acceptable here only because GitHub-hosted runners
      # are throwaway VMs whose jobs already have sudo and the docker socket.
      # Revisit this step before running the job on a self-hosted runner.
      - name: Run tests with cgroups (privileged container)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace \
            -v "${RUNNER_TEMP}/cargo-registry:/usr/local/cargo/registry" \
            -e CARGO_TARGET_DIR=/workspace/target/docker \
            -e CARGO_TERM_COLOR -e CARGO_INCREMENTAL -e RUST_BACKTRACE \
            -e TEXRUN_REQUIRE_TEXLIVE=1 \
            -e TEXRUN_REQUIRE_PREVIEW_TOOLS=1 \
            "${IMAGE}" \
            docker/dev/with-cgroup.sh \
            cargo test --workspace --all-features --locked
      - name: Save cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/docker
            ${{ runner.temp }}/cargo-registry
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Container backend (#26, docs/development.md "container backend test"):
  # the engine image (docker/engine/Dockerfile) is built and the tests run
  # on the runner against its Docker, as `texrun --backend container`
  # would. TEXRUN_TEST_BACKEND=container runs the #10 fixtures (scenarios /
  # security) and the preview tests (real_tools, #46) in the container;
  # TEXRUN_REQUIRE_SANDBOX / _TEXLIVE turn a
  # missing runtime, image or TeX Live into a failure instead of a skip.
  sandbox:
    name: sandbox
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEXRUN_SANDBOX_IMAGE: texrun-engine:ci
      TEXRUN_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Cached like the dev image (written from main pushes only).
      - name: Build engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/engine
          file: docker/engine/Dockerfile
          tags: ${{ env.TEXRUN_SANDBOX_IMAGE }}
          load: true
          cache-from: type=gha,scope=texrun-engine
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=texrun-engine,mode=max' || '' }}
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tool versions
        run: |
          docker version --format 'docker {{.Server.Version}} ({{.Server.Os}}/{{.Server.Arch}})'
          docker run --rm --network none --entrypoint /usr/bin/latexmk "${TEXRUN_SANDBOX_IMAGE}" -v | head -n 2
      # Like the integration job, fail if any test is #[ignore]d.
      - name: Run container backend tests
        shell: bash
        env:
          TEXRUN_REQUIRE_TEXLIVE: "1"
          TEXRUN_TEST_BACKEND: container
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/sandbox.log"
          cargo test --locked --all-features -p texrun-sandbox 2>&1 | tee "${log}"
          cargo test --locked --all-features -p texrun-texlive \
            --test container --test scenarios --test security 2>&1 | tee -a "${log}"
          cargo test --locked --all-features -p texrun-preview \
            --test container --test real_tools 2>&1 | tee -a "${log}"
          cargo test --locked --all-features -p texrun --test container 2>&1 | tee -a "${log}"
          if grep -E 'test result: .* [1-9][0-9]* ignored' "${log}"; then
            echo "::error::Some tests are #[ignore]d and never run in CI"
            exit 1
          fi
      - name: No containers left behind
        run: |
          left="$(docker ps --all --quiet --filter label=org.texrun.sandbox)"
          if [ -n "${left}" ]; then
            docker ps --all --filter label=org.texrun.sandbox
            echo "::error::texrun left containers behind"
            exit 1
          fi

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show
      # The tool version is not updated by Dependabot; bump it manually.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20
      - run: cargo deny --locked check

  # Single aggregate check for branch protection, so the required check list
  # does not need to change when jobs are added or the matrix changes.
  # Not run on schedule: only `deny` runs then, and its failure fails the run.
  # `always()` keeps it from being skipped when a needed job fails on PRs.
  ci-success:
    name: ci-success
    if: always() && github.event_name != 'schedule'
    needs: [fmt, check, clippy, test, integration, sandbox, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::a required job did not succeed (${r})"
              exit 1
            fi
          done
