version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Produces "chore(deps): ..." as required by CONTRIBUTING.md for both
      # normal and dev-dependencies. (`include: scope` would produce
      # "chore(deps-dev): ..." for dev-dependency updates.)
      prefix: chore(deps)
      prefix-development: chore(deps)
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ["*"]

  # Base image of the dev / CI image (docker/dev/Dockerfile), pinned by
  # digest. Only digest updates of the pinned tag are wanted: the Rust
  # version in the tag must move together with rust-toolchain.toml, so it is
  # bumped by hand.
  - package-ecosystem: docker
    directory: /docker/dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
