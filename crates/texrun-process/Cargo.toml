[package]
name = "texrun-process"
description = "Supervised execution of external programs for texrun: process groups, limits and bounded output capture."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
texrun-core.workspace = true
thiserror.workspace = true
# Unix only: process groups, `killpg`, `waitid`, `prlimit` / `setrlimit`,
# `fstat` and the stdin redirection of the exec gate.
rustix = { workspace = true, features = ["fs", "process", "stdio"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
