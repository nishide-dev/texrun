[package]
name = "texrun-texlive"
description = "TeX Live + latexmk engine for texrun."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Opening files TeX / BibTeX wrote or read with `O_NOFOLLOW | O_NONBLOCK`.
rustix.workspace = true
tempfile.workspace = true
texrun-core.workspace = true
texrun-latex-log.workspace = true
# Process groups, the poll loop and resource limits (Unix only).
texrun-process.workspace = true
# The container backend (`ContainerEngine`).
texrun-sandbox.workspace = true

[dev-dependencies]
# `setrlimit` on the test process itself (core dump test).
rustix = { workspace = true, features = ["process"] }
texrun-preview.workspace = true
texrun-workspace.workspace = true

[lints]
workspace = true
