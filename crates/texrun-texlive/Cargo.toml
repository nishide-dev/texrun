[package]
name = "texrun-texlive"
description = "TeX Live + latexmk engine for texrun."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tempfile.workspace = true
texrun-core.workspace = true
texrun-latex-log.workspace = true

# Unix only: process groups, `killpg` and resource limits.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
texrun-workspace.workspace = true

[lints]
workspace = true
