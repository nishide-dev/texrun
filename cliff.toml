# git-cliff (https://git-cliff.org) configuration for the "What's changed"
# part of the release notes. The release workflow renders it through
# .github/scripts/release-notes.sh, which picks the release of one tag and
# adds the install / engine image sections (docs/development.md, "release
# notes").
#
# The notes come from the commit titles on main, which are the PR titles
# (squash merge, Conventional Commits; CONTRIBUTING.md). The type decides
# the section; `!` or a `BREAKING CHANGE:` footer marks a breaking change.
#
# Locally: `git cliff` prints the whole history as a changelog (nothing is
# committed; the GitHub releases are the changelog).

[changelog]
header = ""
body = """
{%- set repo = "https://github.com/nishide-dev/texrun" -%}
{%- if version -%}
## [{{ version }}]({{ repo }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## Unreleased
{%- endif %}
{%- set breaking = commits | filter(attribute="breaking", value=true) %}
{%- if breaking | length > 0 %}

### Breaking changes
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.breaking_description | default(value=commit.message) | upper_first }}
{%- endfor %}
{%- endif %}
{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}
{% if group is ending_with("Dependencies") %}
- {{ commits | length }} dependency update{% if commits | length > 1 %}s{% endif %} (Dependabot):
  {%- for commit in commits %}{% for link in commit.links %} [{{ link.text }}]({{ link.href }}){% endfor %}{% if not loop.last %},{% endif %}{% endfor %}
{%- else %}
{%- for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{%- endif %}
{%- endfor %}
{%- if previous and previous.version %}

**Full diff**: [{{ previous.version }}...{{ version | default(value="main") }}]({{ repo }}/compare/{{ previous.version }}...{{ version | default(value="main") }})
{%- endif %}
{{ "" }}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Commits that are not Conventional Commits (none so far) go to "Other
# changes" instead of disappearing.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Release tags; a tag that is not v<semver> does not start a release.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  # The PR number squash merge appends, as a link.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/nishide-dev/texrun/pull/${1}))" },
]
# The PR number of a commit (from the link above), for the one line that
# lists the dependency updates.
link_parsers = [
  { pattern = '\[#([0-9]+)\]\(https://github\.com/nishide-dev/texrun/pull/[0-9]+\)\)$', href = "https://github.com/nishide-dev/texrun/pull/$1", text = "#$1" },
]
# The first matching parser decides the section; the HTML comments only
# order the sections and are stripped from the headings.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^chore\\(deps\\)", group = "<!-- 9 -->Dependencies" },
  { message = "^(refactor|test|build|chore)", group = "<!-- 4 -->Other changes" },
  { message = ".*", group = "<!-- 4 -->Other changes" },
]
