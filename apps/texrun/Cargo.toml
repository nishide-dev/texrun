[package]
name = "texrun"
description = "A CLI for compiling LaTeX documents with structured diagnostics."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "texrun"
path = "src/main.rs"

# Unix only, like the engine and workspace crates it drives.
[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
texrun-core.workspace = true
texrun-preview.workspace = true
# The exec gate hosted by `texrun __exec-gate`.
texrun-process.workspace = true
texrun-texlive.workspace = true
texrun-workspace.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
