[workspace]
resolver = "3"
members = [
    "apps/texrun",
    "crates/texrun-core",
    "crates/texrun-latex-log",
    "crates/texrun-texlive",
    "crates/texrun-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nishide-dev/texrun"
rust-version = "1.98"

[workspace.dependencies]
# Internal crates
texrun-core = { path = "crates/texrun-core", version = "0.1.0" }
texrun-latex-log = { path = "crates/texrun-latex-log", version = "0.1.0" }
texrun-texlive = { path = "crates/texrun-texlive", version = "0.1.0" }
texrun-workspace = { path = "crates/texrun-workspace", version = "0.1.0" }

# External crates (add only when an issue actually needs them)
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rustix = { version = "1.1.5", features = ["fs"] }
tempfile = "3.27"
unicode-normalization = "0.1.25"
thiserror = "2.0.21"

# Dev-only external crates
# `std` only: no fork / timeout support (and their tempfile / wait-timeout deps).
proptest = { version = "1.11", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add more noise than value at this stage.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
