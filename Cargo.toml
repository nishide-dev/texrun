[workspace]
resolver = "3"
members = ["apps/texrun", "crates/texrun-core", "crates/texrun-workspace"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nishide-dev/texrun"
rust-version = "1.98"

[workspace.dependencies]
# Internal crates
texrun-core = { path = "crates/texrun-core", version = "0.1.0" }
texrun-workspace = { path = "crates/texrun-workspace", version = "0.1.0" }

# External crates (add only when an issue actually needs them)
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add more noise than value at this stage.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
